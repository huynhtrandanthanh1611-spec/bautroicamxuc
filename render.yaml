# Render Free + Supabase Free. Không gắn Disk, không tạo Render Postgres.
# Chạy supabase/001_sky.sql trong project Supabase trước khi triển khai.
services:
  - type: web
    name: bau-troi-cam-xuc
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: sky-images
      - key: TRUST_PROXY
        value: "1"
      - key: TEACHER_PASSWORD
        sync: false
